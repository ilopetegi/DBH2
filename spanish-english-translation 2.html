<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traducciones – Mixed Tenses</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
    }
    
    h1 {
      text-align: center;
      color: #f5576c;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    
    .progress-bar {
      width: 100%;
      height: 30px;
      background: #e0e0e0;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 30px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
      width: 0%;
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    
    .question {
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    
    .question:hover {
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    
    .question.correct {
      background: #d4edda;
      border-color: #28a745;
    }
    
    .spanish-text {
      font-size: 1.2em;
      color: #333;
      margin-bottom: 15px;
      font-weight: 500;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
      transition: border-color 0.3s ease;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #f5576c;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }
    
    .check-btn {
      background: #f5576c;
      color: white;
    }
    
    .check-btn:hover {
      background: #e04556;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
    }
    
    .show-btn {
      background: #ffc107;
      color: #333;
    }
    
    .show-btn:hover {
      background: #e0a800;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
    }
    
    .reset-btn {
      background: #6c757d;
      color: white;
    }
    
    .reset-btn:hover {
      background: #5a6268;
    }
    
    .feedback {
      margin-top: 10px;
      font-weight: bold;
      font-size: 1.1em;
      display: none;
    }
    
    .feedback.correct {
      color: #28a745;
      display: block;
    }
    
    .feedback.incorrect {
      color: #dc3545;
      display: block;
    }
    
    .answer {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      border-radius: 4px;
    }
    
    .answer.show {
      display: block;
    }
    
    .score-display {
      text-align: center;
      font-size: 1.5em;
      color: #f5576c;
      margin-bottom: 20px;
      font-weight: bold;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      
      h1 {
        font-size: 1.8em;
      }
      
      .button-group {
        flex-direction: column;
      }
      
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🇬🇧 Traducciones al Inglés</h1>
  <p class="subtitle">Present Simple, Present Continuous & Past Simple mezclados</p>
  
  <div class="score-display" id="scoreDisplay">Respuestas correctas: 0 / 20</div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill">0%</div>
  </div>
  
  <div id="container"></div>
</div>

<script>
const exercises = [
  {es: "1. Yo tengo un perro y un gato.", en: "I have a dog and a cat."},
  {es: "2. Ahora mismo estoy estudiando inglés.", en: "Right now I am studying English."},
  {es: "3. Mi hermana vive en Barcelona.", en: "My sister lives in Barcelona."},
  {es: "4. ¿Qué estás haciendo?", en: "What are you doing?"},
  {es: "5. Ayer fui al cine con mis amigos.", en: "Yesterday I went to the cinema with my friends."},
  {es: "6. Ellos están jugando al fútbol en el parque.", en: "They are playing football in the park."},
  {es: "7. Mi padre trabaja en un hospital.", en: "My father works in a hospital."},
  {es: "8. Estamos viendo una película ahora.", en: "We are watching a film now."},
  {es: "9. El año pasado viajé a Italia.", en: "Last year I travelled to Italy."},
  {es: "10. Mi hermano está durmiendo en su habitación.", en: "My brother is sleeping in his room."},
  {es: "11. Ella va al gimnasio todos los días.", en: "She goes to the gym every day."},
  {es: "12. ¿Está lloviendo ahora?", en: "Is it raining now?"},
  {es: "13. El sábado pasado jugamos un partido muy emocionante.", en: "Last Saturday we played a very exciting match."},
  {es: "14. Mi madre no está trabajando hoy.", en: "My mother is not working today."},
  {es: "15. Normalmente desayuno a las ocho.", en: "I usually have breakfast at eight."},
  {es: "16. Ahora están esperando el autobús.", en: "Now they are waiting for the bus."},
  {es: "17. Mi profesora siempre explica todo muy bien.", en: "My teacher always explains everything very well."},
  {es: "18. Ayer comí pizza para cenar.", en: "Yesterday I ate pizza for dinner."},
  {es: "19. ¿Estás escuchando música?", en: "Are you listening to music?"},
  {es: "20. Los niños juegan en el jardín todos los días, pero hoy están jugando en casa.", en: "The children play in the garden every day, but today they are playing at home."}
];

const container = document.getElementById("container");
let correctAnswers = 0;

exercises.forEach((item, index) => {
  const div = document.createElement("div");
  div.className = "question";
  div.id = `question-${index}`;

  div.innerHTML = `
    <div class="spanish-text">${item.es}</div>
    <input type="text" id="input-${index}" placeholder="Escribe tu respuesta aquí...">
    <div class="button-group">
      <button class="check-btn" onclick="check(${index})">✓ Check</button>
      <button class="show-btn" onclick="showAnswer(${index})">👁 Show answer</button>
      <button class="reset-btn" onclick="resetQuestion(${index})">↻ Reset</button>
    </div>
    <div id="feedback-${index}" class="feedback"></div>
    <div id="answer-${index}" class="answer"><b>Respuesta correcta:</b> ${item.en}</div>
  `;

  container.appendChild(div);
});

function updateScore() {
  document.getElementById("scoreDisplay").textContent = `Respuestas correctas: ${correctAnswers} / 20`;
  const percentage = (correctAnswers / 20) * 100;
  const progressFill = document.getElementById("progressFill");
  progressFill.style.width = percentage + "%";
  progressFill.textContent = Math.round(percentage) + "%";
}

window.check = function(i) {
  const userInput = document.getElementById("input-" + i).value.trim().toLowerCase();
  const correct = exercises[i].en.toLowerCase();
  const feedback = document.getElementById("feedback-" + i);
  const questionDiv = document.getElementById("question-" + i);

  if (userInput === correct) {
    feedback.textContent = "✓ ¡Correcto! Excelente trabajo.";
    feedback.className = "feedback correct";
    questionDiv.classList.add("correct");
    
    if (!questionDiv.dataset.counted) {
      correctAnswers++;
      questionDiv.dataset.counted = "true";
      updateScore();
    }
  } else {
    feedback.textContent = "✗ Incorrecto. Inténtalo de nuevo o muestra la respuesta.";
    feedback.className = "feedback incorrect";
  }
};

window.showAnswer = function(i) {
  const answerDiv = document.getElementById("answer-" + i);
  answerDiv.classList.add("show");
};

window.resetQuestion = function(i) {
  const input = document.getElementById("input-" + i);
  const feedback = document.getElementById("feedback-" + i);
  const answerDiv = document.getElementById("answer-" + i);
  const questionDiv = document.getElementById("question-" + i);
  
  input.value = "";
  feedback.textContent = "";
  feedback.className = "feedback";
  answerDiv.classList.remove("show");
  
  if (questionDiv.dataset.counted) {
    correctAnswers--;
    delete questionDiv.dataset.counted;
    questionDiv.classList.remove("correct");
    updateScore();
  }
};

updateScore();
</script>

</body>
</html>
